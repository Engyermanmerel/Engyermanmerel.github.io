<section id="skills-section" class="section_normal">
  <div class="container">
    <header class="ti-sect ti-sect--left">
      <span class="section-span">Engineering Stack</span>
      <h2>Product Development Lifecycle</h2>
    </header>

    <div class="skills__visual-container">
      <img 
        src="./assets/Background_Home_Page/Skill_Resource/Redesign of Skill Section - Normal Status.png"
        alt="Product Development Lifecycle Diagram"
        class="skills__diagram"
        loading="lazy"
      >

      <div class="skills__hotspots">
        <button class="hotspot hotspot--1" data-modal-open="concept-modal" type="button">
          <span class="hotspot__pulse"></span>
          <span class="material-icons" aria-hidden="true">add</span>
          <span class="hotspot__label">Concept</span>
        </button>

        <button class="hotspot hotspot--2" data-modal-open="development-modal" type="button">
          <span class="hotspot__pulse"></span>
          <span class="material-icons" aria-hidden="true">add</span>
          <span class="hotspot__label">Development</span>
        </button>

        <button class="hotspot hotspot--3" data-modal-open="realization-modal" type="button">
          <span class="hotspot__pulse"></span>
          <span class="material-icons" aria-hidden="true">add</span>
          <span class="hotspot__label">Realization</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Modales -->
  <!-- Concept Modal -->
  <div id="concept-modal" class="modal" aria-hidden="true">
    <div class="modal__content" tabindex="-1">
    
      <button class="modal__close-btn" data-modal-close aria-label="Cerrar modal">
        &times;
      </button>

      <div class="modal__body">
        <h3>Título del Modal</h3>
        <p>Este contenido puede variar en cada sección.</p>
      </div>
    </div>
  </div>

  <!-- Development Modal -->
  <div id="development-modal" class="modal" aria-hidden="true">
    <div class="modal__content" tabindex="-1">
    
      <button class="modal__close-btn" data-modal-close aria-label="Cerrar modal">
        &times;
      </button>

      <div class="modal__body">
        <h3>Título del Modal</h3>
        <p>Este contenido puede variar en cada sección.</p>
      </div>
    </div>
  </div>

  <!-- Realization Modal -->
  <div id="realization-modal" class="modal" aria-hidden="true">
    <div class="modal__content" tabindex="-1">
    
      <button class="modal__close-btn" data-modal-close aria-label="Cerrar modal">
        &times;
      </button>

      <div class="modal__body">
        <h3>Título del Modal</h3>
        <p>Este contenido puede variar en cada sección.</p>
      </div>
    </div>
  </div>


</div>
</section>
